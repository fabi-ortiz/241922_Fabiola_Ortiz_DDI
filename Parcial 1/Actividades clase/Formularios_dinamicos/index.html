<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios dinamicos</title>
</head>
<body>
    <form action="">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" 
        placeholder="ingresa el nombre" id="input_txt_nombre" >
     <br>
        <label for="apellido">Apellido</label>
        <input type="text" name="apellido" 
        placeholder="ingresa el apellido" id="input_txt_apellido" >
        <br>
        <label for="cantidad_correos">Ingresar la cantidad de correos que va ingresar </label>
        <input type="number" name="cantidad_correos" id="cantidad_correos" onchange="cambiarNumero(event)" >
        
        <div class="contenedor_correos" id="contenedor_correos">
        <br>
       
        <button id="boton_guardar">Guardar datos</button>
    <br>
    </div>
    </form>
</body>
<script src="js/script.js"></script>
</html>
